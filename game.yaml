# Main game environment. See docs/DESIGN.md section 3.
schema_version: 1

board_size: 8
num_players: 2
bases: [[0, 0], [7, 7]]     # player 0, player 1 (point-symmetric about the centre)
units_per_player: 3

resources:
  count: 12                 # must be even: placed as 6 point-symmetric pairs
  values: [2, 4, 6, 8]      # each pair gets one value, drawn by the seeded RNG
  placement: band           # point_symmetric (uniform over half the board) | band (near the anti-diagonal)
  band_width: 2             # band placement only: cells with |row + col - 7| <= band_width
  regrow_turns: 8           # null = never regrow; N = a used-up cell regrows N turns later.
                            # Without regrowth encounters are too rare (P1 gate, DECISIONS D28).

# Shared non-encounter policy (identical for every agent; DESIGN 3.2).
policy:
  targeting: value_per_distance   # nearest | value_per_distance (maximise V / (distance + 1))
  tie_break: player_relative   # player_relative (mirror image per player) | absolute

turn_limit: 40
territory_weight: 1         # score = resources collected + territory_weight * cells owned

seed: 0                     # default seed; CLI / demo / experiments override it
